name: proof-platform
region: nyc
services:
  - name: web
    github:
      repo: AxsolTools/profits
      branch: master
      deploy_on_push: true
    build_command: pnpm install && pnpm build
    run_command: pnpm start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 3000
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
